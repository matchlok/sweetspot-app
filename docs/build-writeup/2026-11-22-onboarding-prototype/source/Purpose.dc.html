<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>This block is for</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090c;--card:#13151c;--line:#262a36;--nav:#0d0f14;--track:#1d2029;--text:#e7e8ee;--text2:#c4c6d2;--muted:#8d90a0;--accent:#c9cffc;--endurance:#7c8cf8;--vo2:#ee7480;--ss:#e0b25c;--todaybg:#1a1d33;--todayline:#3d4680}
body{margin:0;background:#08090c}
*{box-sizing:border-box}
.s{width:390px;height:844px;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;position:relative}
.b{flex:1;min-height:0;overflow-y:auto;padding:24px 16px 12px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.h1{font-size:28px;line-height:1.15;font-weight:700;margin:0;letter-spacing:-.01em}
.p{font-size:15px;line-height:1.45;color:var(--text2);margin:0}
.m{font-size:13px;color:var(--muted)}
.foot{padding:8px 16px 24px;display:flex;flex-direction:column;gap:4px}
a.cta{display:flex;align-items:center;justify-content:center;height:48px;border-radius:14px;background:var(--endurance);color:#0a0b14;font-weight:700;font-size:16px;text-decoration:none}
a.back{display:flex;align-items:center;justify-content:center;height:44px;color:var(--muted);font-weight:600;font-size:15px;text-decoration:none}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-height:64px;cursor:pointer}
.opt.on{background:var(--todaybg);border-color:var(--todayline)}
.radio{width:18px;height:18px;border-radius:9px;border:2px solid #4f5262;flex-shrink:0;margin-top:2px}
.radio.on{border:5px solid var(--endurance);background:#0a0b14}
.oh{display:block;font-size:15px;font-weight:600}
.od{display:block;font-size:13px;color:var(--text2);margin-top:3px;line-height:1.4}
</style>
</helmet>
<div class="s">
<div class="b">
<div class="lbl">Step 2 of 4 · Purpose</div>
<h1 class="h1">This block is for</h1>
<sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
<button class="{{o.cls}}" onClick="{{o.pick}}">
<span class="{{o.rcls}}"></span>
<span>
<span class="oh">{{o.title}}</span>
<span class="od">{{o.desc}}</span>
</span>
</button>
</sc-for>
<div class="card" style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div>
<div class="lbl">Block length</div>
<div style="font-size: 17px; font-weight: 700; margin-top: 4px">{{lengthText}}</div>
</div>
<div class="m" style="text-align: right; max-width: 150px; line-height: 1.35">{{lengthNote}}</div>
</div>
</div>
<div class="foot">
<a class="cta" href="YourWeek.dc.html">Next: your week</a>
<a class="back" href="WhatISee.dc.html">Back</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { sel: 1 };
renderVals() {
const data = [
{ title: 'A race', desc: 'Pick a date and a type, such as Cat 3 XC. The block runs to race day, 12 weeks at most.', len: 'Up to 12 weeks', note: 'Set by your race date' },
{ title: 'Get faster overall', desc: 'Raise sweet spot and VO2 targets with recovery weeks built in.', len: '8 weeks, Nov 23 to Jan 17', note: 'Default for this goal' },
{ title: 'Come back from a break', desc: 'Start at lower targets and build over the block.', len: '8 weeks, Nov 23 to Jan 17', note: 'Default for this goal' },
{ title: 'Hold fitness through a busy stretch', desc: 'Keep what you have in the time you have.', len: '8 weeks, Nov 23 to Jan 17', note: 'Default for this goal' }
];
const sel = this.state.sel;
const opts = data.map((d, i) => ({
title: d.title,
desc: d.desc,
cls: i === sel ? 'opt on' : 'opt',
rcls: i === sel ? 'radio on' : 'radio',
pick: () => this.setState({ sel: i })
}));
return { opts, lengthText: data[sel].len, lengthNote: data[sel].note };
}
}
</script>
</body>
</html>
