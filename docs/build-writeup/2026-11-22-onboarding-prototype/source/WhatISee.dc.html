<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What I see</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090c;--card:#13151c;--line:#262a36;--nav:#0d0f14;--track:#1d2029;--text:#e7e8ee;--text2:#c4c6d2;--muted:#8d90a0;--accent:#c9cffc;--endurance:#7c8cf8;--vo2:#ee7480;--ss:#e0b25c;--todaybg:#1a1d33;--todayline:#3d4680}
body{margin:0;background:#08090c}
*{box-sizing:border-box}
.s{width:390px;height:844px;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;position:relative}
.b{flex:1;min-height:0;overflow-y:auto;padding:24px 16px 12px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.h1{font-size:28px;line-height:1.15;font-weight:700;margin:0;letter-spacing:-.01em}
.p{font-size:15px;line-height:1.45;color:var(--text2);margin:0}
.m{font-size:13px;color:var(--muted)}
.foot{padding:8px 16px 24px;display:flex;flex-direction:column;gap:4px}
a.cta{display:flex;align-items:center;justify-content:center;height:48px;border-radius:14px;background:var(--endurance);color:#0a0b14;font-weight:700;font-size:16px;text-decoration:none}
a.back{display:flex;align-items:center;justify-content:center;height:44px;color:var(--muted);font-weight:600;font-size:15px;text-decoration:none}
.r{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;border-top:1px solid var(--track)}
.r.first{border-top:0}
.v{font-size:17px;font-weight:700}
.k{font-size:13px;color:var(--muted);margin-top:2px}
.nr{min-height:44px;padding:0 4px 0 12px;background:none;border:0;color:var(--muted);font:600 13px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:underline}
.fix{padding:0 0 12px;display:flex;gap:8px}
.fix input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:#0f1116;color:var(--text);font:500 16px Inter,system-ui,sans-serif;padding:0 12px}
</style>
</helmet>
<div class="s">
<div class="b">
<div class="lbl">Step 1 of 4 · Last 8 weeks</div>
<h1 class="h1">Here's what I see.</h1>
<p class="p">Pulled from intervals.icu and Strava. Tap "Not right?" on any line to correct it.</p>
<div class="card" style="padding: 2px 16px">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
<div style="border-top: 1px solid var(--track)">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 56px">
<div>
<div class="v">{{row.value}}</div>
<div class="k">{{row.label}}</div>
</div>
<button class="nr" onClick="{{row.toggle}}">Not right?</button>
</div>
<sc-if value="{{row.open}}" hint-placeholder-val="{{ false }}">
<div class="fix">
<input type="text" placeholder="{{row.ph}}" aria-label="Correct value for {{row.label}}">
<button style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--todayline); background: var(--todaybg); color: var(--accent); font: 600 14px Inter, system-ui, sans-serif; cursor: pointer" onClick="{{row.toggle}}">Save</button>
</div>
</sc-if>
</div>
</sc-for>
</div>
</div>
<div class="foot">
<a class="cta" href="Purpose.dc.html">Looks right</a>
<a class="back" href="Main.dc.html">Back</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { open: -1 };
renderVals() {
const data = [
{ value: '4.1 rides a week', label: 'Average over the last 8 weeks', ph: 'Rides a week' },
{ value: '3 h 30 min a week', label: 'Time on the bike, 8-week average', ph: 'Hours a week' },
{ value: 'Tue, Thu, Sat, Sun', label: 'Days you usually ride', ph: 'Days you ride' },
{ value: '248 W', label: 'FTP, set Nov 7 on intervals.icu', ph: 'FTP in watts' },
{ value: 'Form -6', label: 'Fitness (CTL) 42', ph: 'Form' },
{ value: '1.6 sessions a week', label: 'Strength, from Strava', ph: 'Sessions a week' }
];
const rows = data.map((d, i) => ({
value: d.value,
label: d.label,
ph: d.ph,
open: this.state.open === i,
toggle: () => this.setState({ open: this.state.open === i ? -1 : i })
}));
return { rows };
}
}
</script>
</body>
</html>
